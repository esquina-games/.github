# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/lp). Não edite aqui.
# CD da LP pela esteira da org (esquina-games/infra-actions-workflows, lp-publicar.yml): depois do CI verde na main,
# build com a URL de produção, `wrangler deploy` (arquivos estáticos no Worker <id>) e smoke no ar. Domínio próprio:
# variável LP_DOMINIO (só o domínio; a Cloudflare cria o certificado). GA4: variável WEB_GA_ID (G-…).
# Sem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (o "Preparar repositórios" da esteira grava os da org), avisa e não
# faz nada.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  producao:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: esquina-games/infra-actions-workflows/.github/workflows/lp-publicar.yml@v1
    with:
      ambiente: producao
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
