# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/flutter). Não edite aqui.
# CI da esteira da org (esquina-games/infra-actions-workflows), modelo flutter: app Flutter em app/ (layout do
# base-flutter). Roda em todo pull request e em push na main. Checks obrigatórios na main: "pins / Pins das actions" e
# "app / App Flutter" (formatação, analyze, testes com cobertura e APK de depuração).
# Runner: a esteira escolhe (GitHub → Cloudflare → casa) pela variável RUNNER (gravada pelo Worker de
# esquina-games/infra-runner).
# Não personalize este arquivo: versão do Flutter e build web do projeto vão no .esteira-config da raiz (versao-flutter=…,
# web=true), assim o "Atualizar projetos" da esteira continua trocando ele.
name: CI

on:
  pull_request:
  push:
    branches: [$default-branch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    uses: esquina-games/infra-actions-workflows/.github/workflows/verificar-pins.yml@v1

  app:
    uses: esquina-games/infra-actions-workflows/.github/workflows/ci-flutter.yml@v1
    with:
      diretorio: app
      formatar: lib test
