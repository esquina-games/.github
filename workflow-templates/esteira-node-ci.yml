# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/node). Não edite aqui.
# CI da esteira da org (esquina-games/infra-actions-workflows), modelo node: projeto Node/TypeScript sem app (Worker,
# servidor, biblioteca). Roda em todo pull request e em push na main. Checks para marcar como obrigatórios em
# Settings → Branches → main: "pins / Pins das actions" e "node / Testes e build".
# Scripts esperados no package.json: typecheck, lint, coverage (ou test, com cobertura: false) e build.
# Runner: a esteira escolhe (GitHub → Cloudflare → casa) pela variável RUNNER (da organização, gravada pelo Worker de
# esquina-games/infra-runner).
name: CI

on:
  pull_request:
  push:
    branches: [$default-branch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    uses: esquina-games/infra-actions-workflows/.github/workflows/verificar-pins.yml@v1

  node:
    uses: esquina-games/infra-actions-workflows/.github/workflows/ci-node.yml@v1
    with:
      padrao-android: ""
