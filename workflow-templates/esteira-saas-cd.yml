# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/saas). Não edite aqui.
# CD do SaaS pela esteira da org (esquina-games/infra-actions-workflows, saas-cd.yml): depois do CI verde na main,
# `pulumi up` (D1 e KV do ambiente, estado no R2 da org), migrações do D1, `wrangler deploy` do Worker (API + web) e smoke
# no ar, primeiro em homolog e, passando, em produção. Variável SAAS_GATILHO: vazia ou `merge` (padrão) = produção logo
# depois de homolog; `tag` = produção só pela tag vX.Y.Z (ou release); `manual` = só à mão (Actions → CD → Run workflow).
# Aprovação humana antes da produção: Settings → Environments → producao → Required reviewers.
# Sem CLOUDFLARE_API_TOKEN e o estado do Pulumi (o "Preparar repositórios" da esteira grava), avisa e não faz nada.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [$default-branch]
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      ambiente:
        description: Até onde publicar
        type: choice
        options: [homolog, producao]
        default: homolog

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  cd:
    uses: esquina-games/infra-actions-workflows/.github/workflows/saas-cd.yml@v1
    with:
      ate: ${{ inputs.ambiente || '' }}
    secrets: inherit
