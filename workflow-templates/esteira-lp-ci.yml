# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/lp). Não edite aqui.
# CI da esteira da org (esquina-games/infra-actions-workflows), modelo lp: LP estática em Astro, só web. Roda em todo
# pull request e em push na main. Checks obrigatórios (ruleset esteira-lp da org, propriedade stack = lp):
# "pins / Pins das actions" e "lp / Testes e build". O build valida o src/conteudo/pagina.json (esquema) e o smoke abre o
# dist/ no Chromium em 320×568, 412×915 e 1280×800 (scripts/smoke.mjs).
name: CI

on:
  pull_request:
  push:
    branches: [$default-branch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    uses: esquina-games/infra-actions-workflows/.github/workflows/verificar-pins.yml@v1

  lp:
    uses: esquina-games/infra-actions-workflows/.github/workflows/ci-node.yml@v1
    with:
      lint: false
      cobertura: false
      saidas-build: |
        dist/index.html
        dist/privacidade/index.html
        dist/404.html
        dist/robots.txt
        dist/sitemap.xml
      pasta-build: dist
      smoke: true
      padrao-android: ""
