# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/saas). Não edite aqui.
# Construção pelo Claude (esteira, claude-construir.yml): issue com a label `claude`, comentário com @claude numa issue
# ou PR, ou disparado pelo workflow ROADMAP com o número da issue (SAAS_CLAUDE_AUTOMATICO=true). O Claude implementa
# seguindo o CLAUDE.md e as skills, roda testes, lint e typecheck, e abre o PR que fecha a issue; o CI, a revisão e o
# CD seguem dali. Com SAAS_AUTOMERGE=true, o PR entra sozinho quando os checks obrigatórios ficam verdes.
# Precisa do segredo CLAUDE_CODE_OAUTH_TOKEN (o "Preparar repositórios" grava o da org) e do app do Claude no GitHub.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue para o Claude construir
        type: number
        required: true

concurrency:
  group: claude-${{ inputs.issue || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'claude' && github.event.sender.type != 'Bot') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    uses: esquina-games/infra-actions-workflows/.github/workflows/claude-construir.yml@v1
    with:
      issue: ${{ inputs.issue || 0 }}
    secrets: inherit
