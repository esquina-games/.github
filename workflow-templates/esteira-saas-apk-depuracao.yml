# Gerado por scripts/gerar-templates-org.sh (esquina-games/infra-actions-workflows, modelos/saas). Não edite aqui.
# APK de depuração pela esteira da org (esquina-games/infra-actions-workflows), modelo saas: à mão (Actions → APK de
# depuração → Run workflow, escolhendo a branch e o ambiente), gera o APK de depuração (build web pelo script
# build:depuracao do package.json) com a tela de depuração da casca (chacoalhe o celular ou toque na notificação
# "Depuração") e guarda por 14 dias como artefato. O ambiente escolhe as variáveis do environment do GitHub (o
# WEB_API_URL de homolog ou de produção; sem ele no environment, vale o do repositório). Assinado com a chave de upload
# quando o repositório tem os segredos da Play. Detalhes no topo de apk-depuracao-capacitor.yml.
# Não personalize este arquivo: prefixos do build vão no .esteira-config da raiz (prefixos-build=…), assim o
# "Atualizar projetos" da esteira continua trocando ele.
name: APK de depuração

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'API que o app chama (WEB_API_URL do environment)'
        type: choice
        options: [homolog, producao]
        default: homolog

concurrency:
  group: apk-depuracao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    uses: esquina-games/infra-actions-workflows/.github/workflows/apk-depuracao-capacitor.yml@v1
    with:
      ambiente: ${{ inputs.ambiente }}
    secrets: inherit
